<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promo Small Tile 440x280</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      width: 440px;
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      position: relative;
    }

    .icon img {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="icon">
    <img src="../../icons/icon.svg" alt="Auto Cookie Reject">
  </div>
  <div class="title">Auto Cookie Reject</div>
  <div class="subtitle">Automatically reject cookie popups.<br>Privacy-first. 100% local.</div>
</body>
</html>
