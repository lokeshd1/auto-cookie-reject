<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Bright purple background -->
  <rect width="128" height="128" rx="28" fill="#7C3AED"/>

  <!-- Simple cookie - beige circle -->
  <circle cx="64" cy="64" r="40" fill="#FCD34D"/>

  <!-- Three chocolate chips -->
  <circle cx="50" cy="54" r="8" fill="#92400E"/>
  <circle cx="78" cy="58" r="7" fill="#92400E"/>
  <circle cx="58" cy="78" r="8" fill="#92400E"/>

  <!-- Bold red X cross -->
  <line x1="28" y1="28" x2="100" y2="100" stroke="#EF4444" stroke-width="16" stroke-linecap="round"/>
  <line x1="100" y1="28" x2="28" y2="100" stroke="#EF4444" stroke-width="16" stroke-linecap="round"/>
</svg>
