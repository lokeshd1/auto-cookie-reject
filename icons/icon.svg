<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4D03F"/>
      <stop offset="100%" style="stop-color:#D4AC0D"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>

  <!-- Cookie (larger, more visible) -->
  <circle cx="64" cy="64" r="38" fill="url(#cookieGrad)"/>

  <!-- Cookie chips (larger, better contrast) -->
  <circle cx="48" cy="52" r="7" fill="#8B4513"/>
  <circle cx="72" cy="48" r="6" fill="#8B4513"/>
  <circle cx="56" cy="76" r="7" fill="#8B4513"/>
  <circle cx="80" cy="72" r="5" fill="#8B4513"/>
  <circle cx="44" cy="70" r="4" fill="#8B4513"/>

  <!-- Cookie bite mark -->
  <circle cx="95" cy="40" r="14" fill="url(#bgGrad)"/>

  <!-- Bold prohibition circle -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#FF3B3B" stroke-width="10"/>

  <!-- Bold diagonal slash -->
  <line x1="33" y1="33" x2="95" y2="95" stroke="#FF3B3B" stroke-width="10" stroke-linecap="round"/>
</svg>
