<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Cookie Reject</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      width: 300px;
      background: #1a1a2e;
      color: #eee;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 11px;
      opacity: 0.9;
    }

    .content {
      padding: 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .toggle-label {
      font-size: 14px;
    }

    .toggle-sublabel {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    /* Toggle Switch */
    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      transition: 0.3s;
      border-radius: 26px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .stats {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .stats-title {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .stats-row:last-child {
      margin-bottom: 0;
    }

    .stats-label {
      font-size: 13px;
    }

    .stats-value {
      font-size: 13px;
      font-weight: 600;
      color: #667eea;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .status.active {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
    }

    .status.disabled {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #2a2a4e;
      text-align: center;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-size: 11px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .domain-info {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 8px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 12px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Auto Cookie Reject</h1>
    <p>Privacy-first cookie consent blocker</p>
  </div>

  <div class="content">
    <div class="domain-info" id="domain-info">
      Loading...
    </div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Enabled globally</div>
        <div class="toggle-sublabel">Auto-reject on all sites</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="global-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Enabled on this site</div>
        <div class="toggle-sublabel">Toggle for current domain</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="site-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="stats">
      <div class="stats-title">Statistics</div>
      <div class="stats-row">
        <span class="stats-label">Banners blocked today</span>
        <span class="stats-value" id="today-count">0</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Total banners blocked</span>
        <span class="stats-value" id="total-count">0</span>
      </div>
    </div>

    <div class="status active" id="status">
      Protection Active
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/user/auto-cookie-reject" target="_blank">Report an issue</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
